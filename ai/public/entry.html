<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>잇다 | 청소년 통합지원</title>
  <style>
    :root { --ink:#172033; --muted:#65748b; --blue:#175cd3; --line:#dce4ef; --pale:#f4f8ff; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:#f7f9fc; font-family:Pretendard, "Noto Sans KR", sans-serif; }
    main { width:min(980px, calc(100% - 40px)); margin:0 auto; padding:clamp(54px, 10vh, 116px) 0; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; } .mark { display:grid; place-items:center; width:36px; height:36px; color:#fff; background:var(--blue); border-radius:10px; } .brand small { display:block; color:var(--muted); font-weight:600; font-size:11px; margin-top:2px; }
    .intro { max-width:620px; margin:74px 0 35px; } .eyebrow { margin:0 0 12px; color:var(--blue); font-size:11px; font-weight:800; letter-spacing:.1em; } h1 { margin:0; letter-spacing:-.055em; font-size:clamp(38px,6vw,60px); line-height:1.12; text-wrap:balance; } .intro p:last-child { max-width:560px; color:var(--muted); font-size:16px; line-height:1.75; }
    .choices { display:grid; grid-template-columns:1fr 1fr; gap:16px; } .choice { position:relative; min-height:255px; padding:26px; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:#fff; color:inherit; text-decoration:none; box-shadow:0 8px 22px rgba(25,47,80,.045); transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease; } .choice:hover { transform:translateY(-3px); border-color:#9dc0fb; box-shadow:0 15px 32px rgba(25,47,80,.1); } .choice:active { transform:scale(.98); } .choice.student { background:linear-gradient(145deg,#fff 0%,#edf5ff 100%); } .choice .icon { display:grid; place-items:center; width:42px; height:42px; border-radius:13px; background:#dbeafe; color:var(--blue); font-size:20px; } .choice.teacher .icon { background:#eef1f5; color:#34415a; } h2 { margin:22px 0 8px; font-size:22px; letter-spacing:-.04em; } .choice p { max-width:310px; margin:0; color:var(--muted); line-height:1.6; font-size:14px; } .go { position:absolute; bottom:26px; color:var(--blue); font-weight:800; font-size:13px; } .teacher .go { color:#34415a; }
    footer { margin-top:28px; color:#8794a8; font-size:12px; } @media(max-width:650px){ main{width:min(100% - 32px,980px);padding-top:42px}.intro{margin:52px 0 28px}.choices{grid-template-columns:1fr}.choice{min-height:210px} }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">잇</span><span>잇다<small>청소년 통합지원</small></span></div>
    <section class="intro"><p class="eyebrow">NO WRONG DOOR FOR YOUTH</p><h1>도움을 말하는 순간부터,<br>연결될 때까지.</h1><p>학생에게는 편하게 이야기를 시작할 곳을, 교사와 기관에는 끊기지 않는 지원 연계를 제공합니다.</p></section>
    <section class="choices" aria-label="서비스 선택">
      <a class="choice student" href="/chat"><span class="icon">◌</span><h2>학생으로 이야기하기</h2><p>모아와 편하게 대화해 보세요. 도움이 필요할 때는 직접 요청할 수 있어요.</p><span class="go">모아와 대화 시작 →</span></a>
      <a class="choice teacher" href="/teacher"><span class="icon">▦</span><h2>교사 · 기관 Workspace</h2><p>상담 기록을 구조화하고, 지원기관 연계와 진행 상황을 확인하세요.</p><span class="go">Workspace 열기 →</span></a>
    </section>
    <footer>가상 사례 기반 데모 · 최소정보 공유 · 사람의 최종 확인</footer>
  </main>
</body>
</html>
