# Base directory = ai 일 때 이 파일을 사용합니다.
[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/**", "server.js"]

# 정적+API 모두 함수로 (경로 깨짐 방지). MVP용.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true
