name: Netlify Preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai/package-lock.json

      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] || [ -z "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID 가 없습니다. DEPLOY.md 참고."
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Preview (PR)
        id: preview
        if: github.event_name == 'pull_request' && steps.check.outputs.has_secrets == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy \
            --build \
            --alias="pr-${{ github.event.pull_request.number }}" \
            --message="PR #${{ github.event.pull_request.number }}" \
            --json > /tmp/netlify-deploy.json
          url=$(node -p "const d=require('/tmp/netlify-deploy.json'); d.deploy_url || d.url")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Netlify Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Netlify Deploy Preview\n\n**잇다**: ${url}\n\nPR 업데이트 시 자동 재배포됩니다.`
            });
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}

      - name: Deploy Production (main)
        if: github.event_name == 'push' && steps.check.outputs.has_secrets == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --build --prod --message="main ${GITHUB_SHA}"

      - name: Fail if secrets missing on PR
        if: steps.check.outputs.has_secrets == 'false'
        run: |
          echo "Netlify secrets 미설정 — GitHub 앱으로 사이트를 연결하거나 Secrets를 추가하세요. (DEPLOY.md)"
          exit 1
